<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SealPack</title>
    <script>
      // 首帧引导：在 React/Fluent 挂载之前把主题与底色写到根元素上。
      // 窗口以 visible:false 创建，等首帧绘制后才显示，所以不会闪白底。
      //
      // ⚠ 这是内联脚本，而 CSP 是 `script-src 'self'`（没有 'unsafe-inline'）：
      // 它能执行依赖 Tauri 在构建时为内联脚本注入 CSP hash/nonce。
      // 改 CSP、换页面宿主或把这段挪成外链时，必须回归启动首帧的主题。
      (function () {
        var root = document.documentElement;
        var mode = "system";

        try {
          var saved = localStorage.getItem("sealpack:theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* 存储不可用时用默认值 */
        }

        // WebView2 把 prefers-color-scheme 映射到 Windows 的「应用模式」
        var system =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var theme = mode === "system" ? system : mode;
        var dark = theme === "dark";

        root.dataset.theme = theme;
        root.dataset.themeMode = mode;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = theme;
        // 与 src/theme/colors.ts 的 WINDOW_BG 保持一致
        root.style.backgroundColor = dark ? "#202020" : "#f3f3f3";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
