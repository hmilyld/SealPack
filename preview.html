<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SealPack — UI 预览</title>
    <script>
      // 首帧引导（开发版）：额外支持 ?theme= 覆盖。
      // 覆盖结果直接写进 localStorage，由 src/theme/ThemeProvider.tsx 接管，
      // 因此不会出现「预览参数与主题控制器互相打架」的情况。
      (function () {
        var root = document.documentElement;
        var mode = "system";

        try {
          var saved = localStorage.getItem("sealpack:theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* 存储不可用时用默认值 */
        }

        var q = new URLSearchParams(location.search);
        var qTheme = q.get("theme");
        if (qTheme === "light" || qTheme === "dark" || qTheme === "system") mode = qTheme;

        try {
          localStorage.setItem("sealpack:theme", mode);
        } catch (e) {
          /* 忽略 */
        }

        var system =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var theme = mode === "system" ? system : mode;
        var dark = theme === "dark";

        root.dataset.theme = theme;
        root.dataset.themeMode = mode;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = theme;
        // 与 src/theme/colors.ts 的 WINDOW_BG 保持一致
        root.style.backgroundColor = dark ? "#202020" : "#f3f3f3";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 只引用一个入口：mock 与 main 的加载顺序由 preview/entry.ts 保证。
         拆成两个 <script type="module"> 会在 MPA 构建时被 Vite 去重，
         预览页会变成空白（见 preview/entry.ts 的注释）。 -->
    <script type="module" src="/preview/entry.ts"></script>
  </body>
</html>
