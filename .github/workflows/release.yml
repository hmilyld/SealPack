name: Release

# 构建 NSIS 安装包。
#   · 推 v* 标签 → 构建并创建 GitHub Release，把安装包附上去
#   · 手动触发 → 只构建并上传为工作流产物，便于随时验证打包链路

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: 构建安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖（锁文件必须一致）
        run: pnpm install --frozen-lockfile

      - name: 构建（前端 → Rust → NSIS）
        run: pnpm run app:build

      - name: 列出产物
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis/

      - name: 上传为工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: sealpack-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 附到 GitHub Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到安装包，构建可能失败了" >&2
            exit 1
          fi
          # 允许先手动建 Release 再补传产物
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${files[@]}"
          fi
