name: Release

# 构建 NSIS 安装包。
#   · 推 v* 标签 → 构建并创建 GitHub Release，把安装包附上去
#   · 手动触发 → 默认只产出工作流产物；填了 `tag` 输入就一并发布成 Release
#
# 注意「工作流产物」与「Release 附件」是两回事：
#   产物在 Actions 的运行页里，需要登录才能下载、默认 30 天过期，
#   仓库首页与 /releases 都看不到；要让安装包真正对外可见，必须走 Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 可选：填了就发布为该标签的 Release（例如 v0.1.0）；留空只产出工作流产物
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: 构建安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖（锁文件必须一致）
        run: pnpm install --frozen-lockfile

      - name: 构建（前端 → Rust → NSIS）
        run: pnpm run app:build

      - name: 列出产物
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis/

      - name: 上传为工作流产物
        uses: actions/upload-artifact@v7
        with:
          name: sealpack-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 附到 GitHub Release
        # 标签触发，或手动触发时填了 tag 输入
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 标签触发时 inputs.tag 为空，回退到本次的 ref（即标签名）
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到安装包，构建可能失败了" >&2
            exit 1
          fi
          echo "发布标签：$RELEASE_TAG"
          # 允许先手动建 Release 再补传产物
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${files[@]}"
          fi
          echo "完成：$(gh release view "$RELEASE_TAG" --json url --jq .url)"
