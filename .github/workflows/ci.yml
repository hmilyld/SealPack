name: CI

# 四条门禁：前端类型检查与构建、生成器一致性、Rust 格式/lint/单测、界面回归探针。
# 探针与 Rust 都跑在 windows-latest 上 —— 这是唯一的目标平台，
# 放在 ubuntu 上会引入 webkit2gtk 之类的系统依赖，测的也不是真实环境。
#
# 触发时机：PR、推 v* 标签（发版时门禁与 release.yml 的安装包构建并行跑）、手动触发。
# 刻意不在推 main 时跑：日常提交靠本地的最小检查清单兜底，
# CI 只在合入（PR）与发版（标签）这两个节点把关。

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端 · 类型检查 + 预览构建 + 生成器一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁文件必须一致）
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建浏览器预览
        run: pnpm run build:preview

      - name: 校验两侧模板生成器逐字一致
        run: pnpm run check:render-parity

  rust:
    name: Rust · 格式 + clippy + 单测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy（警告即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test

  ui-probe:
    name: 界面回归探针
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建浏览器预览
        run: pnpm run build:preview

      - name: 跑探针
        shell: bash
        # runner 自带 Edge，脚本会自己探测；GITHUB_WORKSPACE 在 Windows 上可能是
        # 反斜杠形式，先归一成 file:/// 能认的写法
        run: node scripts/ui-probe.mjs "file:///${GITHUB_WORKSPACE//\\//}/dist-preview" docs/shots

      - name: 保留截图（失败时也要，便于对照）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-shots
          path: docs/shots
          if-no-files-found: ignore
          retention-days: 7
